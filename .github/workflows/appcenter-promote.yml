# AppCenter 灰度自动放量：发布后先给 ik0001 + deviceId%100<10，满 24 小时自动全量。这一天就是回滚窗口（见 appcenter-rollback）。
name: appcenter-promote

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        default: stable
        required: true

concurrency:
  group: appcenter-manifest
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Promote if due
        env:
          BUCKET: ${{ vars.BACKEND_BUCKET }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
        run: bash appcenter-publish/scripts/rollout-appcenter.sh "$CHANNEL" promote
