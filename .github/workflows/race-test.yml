# 临时：用 vue-app master 构建，发布到 race-test channel 的 rootApps/App，给 ik0001 真机验证 /App 同步；验证完删除
name: race-test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  build-root-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: innerken-gmbh/aaden-vue-app
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      # 跳过根目录 postinstall（electron-builder install-app-deps），但 electron 和 node-sass 自己的安装脚本要跑
      - run: npm install --ignore-scripts && npm rebuild electron node-sass
      - run: npx vue-cli-service build
      - uses: innerken-gmbh/workflows/appcenter-publish@main
        with:
          app: App
          kind: rootApps
          dist: dist
          channel: race-test
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
